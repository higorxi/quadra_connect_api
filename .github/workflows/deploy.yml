name: Deploy NestJS (AWS Lambda)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPO: 828153030828.dkr.ecr.us-east-1.amazonaws.com/quadra-api
  FUNCTION: quadra-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Migrations (conexão direta/session do Supabase)
        run: yarn install --frozen-lockfile && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -t $ECR_REPO:${{ github.sha }} --push .

      - name: Atualizar Lambda
        run: |
          aws lambda update-function-code --function-name $FUNCTION --image-uri $ECR_REPO:${{ github.sha }} >/dev/null
          aws lambda wait function-updated-v2 --function-name $FUNCTION
